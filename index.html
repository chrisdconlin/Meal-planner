<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#1a9e75;--green-l:#e6f7f2;--green-d:#0f6e52;--blue:#2563eb;--blue-l:#dbeafe;--amber:#d97706;--amber-l:#fef3c7;--red:#dc2626;--red-l:#fee2e2;--purple:#7c3aed;--purple-l:#ede9fe;--teal:#0891b2;--teal-l:#e0f2fe;--ink:#111827;--ink2:#374151;--ink3:#6b7280;--ink4:#9ca3af;--line:#e5e7eb;--line2:#f3f4f6;--bg:#f9fafb;--card:#fff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:80px}
.app{max-width:600px;margin:0 auto}
.header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 0;position:sticky;top:0;z-index:50}
.header-title{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:12px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.panel{display:none;padding:14px 16px}.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-badge{font-size:10px;background:var(--line2);color:var(--ink3);border-radius:8px;padding:1px 7px;font-weight:500;text-transform:none;letter-spacing:0}
.slots-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;min-height:72px;position:relative;transition:border-color .15s;background:var(--line2)}
.slot:hover{border-color:var(--green)}
.slot.dinner-filled{background:var(--green-l);border-color:#9FE1CB}
.slot.lunch-filled{background:var(--blue-l);border-color:#93C5FD}
.slot-label{font-size:10px;font-weight:600;color:var(--ink4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.slot-name{font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;margin-bottom:4px}
.slot-note{font-size:11px;color:var(--ink3);margin-bottom:4px;line-height:1.3}
.slot-empty{font-size:13px;color:var(--ink4);margin-top:8px}
.slot-meta{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.slot-rm{position:absolute;top:6px;right:8px;background:none;border:none;font-size:16px;color:var(--ink4);cursor:pointer;line-height:1;padding:2px}
.slot-rm:hover{color:var(--red)}
.slot-badge{font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500}
.badge-ready{background:var(--green-l);color:var(--green-d)}
.badge-needs{background:var(--amber-l);color:var(--amber)}
.badge-fav{background:#fce7f3;color:#9d174d}
.badge-fresh{background:var(--line2);color:var(--ink4)}
.badge-gf{background:#d1fae5;color:#065f46}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.btn:hover{background:var(--line2)}
.btn-green{background:var(--green);border-color:var(--green);color:white}
.btn-green:hover{background:var(--green-d)}
.btn-blue{background:var(--blue);border-color:var(--blue);color:white}
.btn-blue:hover{background:#1d4ed8}
.gf-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--green-l);border:1px solid #9FE1CB;border-radius:9px;margin-bottom:12px}
.gf-toggle-label{font-size:13px;color:var(--green-d);font-weight:500}
.gf-toggle-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.toggle-sw{width:42px;height:24px;border-radius:12px;background:var(--line);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle-sw.on{background:var(--green)}
.toggle-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:9px;background:white;transition:transform .2s}
.toggle-sw.on::after{transform:translateX(18px)}
.tip{font-size:12px;color:var(--ink4);margin-top:8px;line-height:1.5}
.search-input{font-size:14px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;display:block;font-family:'DM Sans',sans-serif}
.search-input:focus{outline:none;border-color:var(--green)}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.filter-btn{font-size:12px;padding:4px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink3);cursor:pointer;font-weight:500}
.filter-btn.active{background:var(--green);border-color:var(--green);color:white}
.meal-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;display:flex;align-items:flex-start;gap:8px;transition:border-color .15s}
.meal-item:hover{border-color:var(--green)}
.meal-item.selected{border-color:var(--green);background:var(--green-l)}
.meal-item.archived{opacity:.45}
.meal-info{flex:1;min-width:0}
.meal-name{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.meal-sub{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.3}
.meal-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.meal-tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500}
.tag-dinner{background:var(--green-l);color:var(--green-d)}
.tag-lunch{background:var(--blue-l);color:var(--blue)}
.tag-both{background:var(--purple-l);color:var(--purple)}
.tag-needs{background:var(--amber-l);color:var(--amber)}
.tag-fav{background:#fce7f3;color:#9d174d}
.tag-new{background:var(--purple-l);color:var(--purple)}
.tag-gf{background:#d1fae5;color:#065f46}
.meal-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.meal-cnt{font-size:11px;color:var(--ink4)}
.meal-link{font-size:11px;color:var(--blue);text-decoration:none;white-space:nowrap}
.meal-actions{display:flex;gap:4px}
.icon-btn{font-size:16px;background:none;border:none;cursor:pointer;color:var(--ink4);padding:2px 4px;line-height:1;border-radius:4px}
.icon-btn:hover{color:var(--ink);background:var(--line2)}
.icon-btn.restore{color:var(--green)}
.group-lbl{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;padding:6px 0 4px;border-bottom:1px solid var(--line2);margin-bottom:6px;margin-top:8px}
.group-lbl:first-child{margin-top:0}
.archive-divider{font-size:12px;color:var(--ink3);padding:8px 0;cursor:pointer;user-select:none}
.empty{text-align:center;padding:20px;color:var(--ink4);font-size:13px}
.add-form{background:var(--line2);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.form-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;display:block}
.form-input{font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%;margin-bottom:8px;font-family:'DM Sans',sans-serif}
.form-input:focus{outline:none;border-color:var(--green)}
textarea.form-input{resize:vertical;min-height:60px}
.grocery-meal-group{margin-bottom:14px}
.grocery-meal-title{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grocery-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)}
.grocery-item:last-child{border-bottom:none}
.g-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.g-check.done{background:var(--green);border-color:var(--green)}
.g-check.done::after{content:"";display:block;width:5px;height:9px;border:2px solid white;border-top:none;border-left:none;transform:rotate(40deg) translate(-1px,-1px)}
.g-text{font-size:13px;color:var(--ink2)}.g-text.done{text-decoration:line-through;color:var(--ink4)}
.picker-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;z-index:100}
.picker-sheet{background:var(--card);border-radius:16px 16px 0 0;padding:16px;width:100%;max-height:78vh;overflow-y:auto}
.picker-header{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.picker-close{font-size:24px;cursor:pointer;color:var(--ink3);background:none;border:none;line-height:1}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;font-size:13px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <div class="header-title">Meal Planner</div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('plan')">This week</div>
    <div class="tab" onclick="switchTab('meals')">Meals</div>
    <div class="tab" onclick="switchTab('grocery')">Grocery</div>
  </div>
</div>

<!-- PLAN -->
<div class="panel active" id="panel-plan">
  <div class="gf-toggle-row">
    <div>
      <div class="gf-toggle-label">GF + low sugar mode</div>
      <div class="gf-toggle-sub">Randomizer only picks gluten-free, lower-sugar meals</div>
    </div>
    <button class="toggle-sw" id="gf-toggle-sw" onclick="toggleGF()"></button>
  </div>
  <div class="card">
    <div class="card-title">Dinners <span class="card-badge" id="dinner-count">0 / 4</span></div>
    <div class="slots-grid" id="dinner-slots"></div>
    <div class="actions">
      <button class="btn btn-blue" onclick="randomize('dinner')">Randomize dinners</button>
      <button class="btn" onclick="addSlot('dinner')" id="add-dinner-btn">+ Add slot</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Lunches <span class="card-badge" id="lunch-count">0 / 4</span></div>
    <div class="slots-grid" id="lunch-slots"></div>
    <div class="actions">
      <button class="btn btn-blue" onclick="randomize('lunch')">Randomize lunches</button>
      <button class="btn" onclick="addSlot('lunch')" id="add-lunch-btn">+ Add slot</button>
    </div>
  </div>
  <div class="actions">
    <button class="btn" onclick="switchTab('grocery')">View grocery list</button>
    <button class="btn" onclick="clearPlan()">Clear all</button>
  </div>
  <div class="tip">Plan persists until you clear it. Tap any slot to swap.</div>
</div>

<!-- MEALS -->
<div class="panel" id="panel-meals">
  <div class="card">
    <div id="add-form-wrap" style="display:none">
      <div class="add-form">
        <label class="form-label">Meal name</label>
        <input type="text" class="form-input" id="new-name" placeholder="e.g. Herb chicken thighs" />
        <label class="form-label">Category</label>
        <select class="form-input" id="new-cat">
          <option value="dinner">Dinner only</option>
          <option value="lunch">Lunch only</option>
          <option value="both">Both lunch & dinner</option>
        </select>
        <label class="form-label">Status</label>
        <select class="form-input" id="new-status">
          <option value="normal">Ready to cook</option>
          <option value="needs">Needs shopping</option>
        </select>
        <label class="form-label">Gluten-free?</label>
        <select class="form-input" id="new-gf">
          <option value="yes">Yes — GF friendly</option>
          <option value="no">No</option>
        </select>
        <label class="form-label">Recipe URL (optional)</label>
        <input type="text" class="form-input" id="new-url" placeholder="https://..." />
        <label class="form-label">Notes (optional)</label>
        <textarea class="form-input" id="new-notes" placeholder="e.g. Use corn tortillas, sub GF soy sauce..."></textarea>
        <label class="form-label">Ingredients to buy (one per line)</label>
        <textarea class="form-input" id="new-ingredients" placeholder="e.g.&#10;1 lb chicken breast&#10;bell peppers"></textarea>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-green" onclick="saveNewMeal()" style="flex:1">Add meal</button>
          <button class="btn" onclick="cancelAdd()">Cancel</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:10px;align-items:center">
      <input type="text" class="search-input" style="margin:0;flex:1" placeholder="Search meals..." oninput="filterMeals(this.value)" />
      <button class="btn btn-green" onclick="toggleAddForm()" style="white-space:nowrap">+ Add meal</button>
    </div>
    <div class="filter-row">
      <div class="filter-btn active" onclick="setFilter('all',this)">All</div>
      <div class="filter-btn" onclick="setFilter('dinner',this)">Dinner</div>
      <div class="filter-btn" onclick="setFilter('lunch',this)">Lunch</div>
      <div class="filter-btn" onclick="setFilter('gf',this)">GF</div>
      <div class="filter-btn" onclick="setFilter('needs',this)">Needs shopping</div>
      <div class="filter-btn" onclick="setFilter('favorites',this)">Favorites</div>
    </div>
    <div id="meal-grid"></div>
  </div>
</div>

<!-- GROCERY -->
<div class="panel" id="panel-grocery">
  <div class="card">
    <div class="card-title">Grocery list <span class="card-badge" id="g-badge"></span>
      <button class="btn" id="copy-btn" onclick="copyGroceryList()" style="margin-left:auto;font-size:11px;padding:4px 10px">Copy list</button>
    </div>
    <div id="grocery-content"></div>
  </div>
</div>

</div>

<!-- PICKER -->
<div id="picker-overlay" class="picker-overlay" style="display:none" onclick="closePicker(event)">
  <div class="picker-sheet">
    <div class="picker-header">
      <span id="picker-title">Pick a meal</span>
      <button class="picker-close" onclick="closePicker()">×</button>
    </div>
    <input type="text" class="search-input" id="picker-search" placeholder="Search..." oninput="renderPickerList(this.value)" />
    <div id="picker-list"></div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div id="detail-overlay" class="picker-overlay" style="display:none" onclick="closeDetail(event)">
  <div class="picker-sheet" id="detail-sheet"></div>
</div>

<div class="toast" id="toast"></div>

var state;
try{state=JSON.parse(localStorage.getItem('mp_v3')||'null');}catch(e){}
if(!state)state={dinners:[null,null,null,null,null,null],lunches:[null,null,null,null,null,null],gc:{},history:{},pickCounts:{},archived:[],custom:[],gfMode:false};
if(!state.dinners)state.dinners=[null,null,null,null,null,null];
if(!state.lunches)state.lunches=[null,null,null,null,null,null];
while(state.dinners.length<6)state.dinners.push(null);
while(state.lunches.length<6)state.lunches.push(null);
if(!state.gc)state.gc={};
if(!state.history)state.history={};
if(!state.pickCounts)state.pickCounts={};
if(!state.archived)state.archived=[];
if(!state.custom)state.custom=[];
if(state.gfMode===undefined)state.gfMode=false;

function save(){try{localStorage.setItem('mp_v3',JSON.stringify(state));}catch(e){}}

function getMeals(){
  return BUILT_IN.concat(state.custom.map(function(m){return Object.assign({},m);})).map(function(m){
    return Object.assign({},m,{ingredients:(m.i||[]).filter(function(x){return !isStaple(x);})});
  });
}
function getDinnerPool(){
  var all=getMeals().filter(function(m){return (m.cat==='dinner'||m.cat==='both')&&!isArchived(m.name);});
  return state.gfMode?all.filter(function(m){return m.gf===true;}):all;
}
function getLunchPool(){
  var all=getMeals().filter(function(m){return (m.cat==='lunch'||m.cat==='both')&&!isArchived(m.name);});
  return state.gfMode?all.filter(function(m){return m.gf===true;}):all;
}
function isArchived(n){return state.archived.includes(n);}
function isFav(n){return (state.pickCounts[n]||0)>=3;}
function agoLabel(n){
  if(!state.history[n])return null;
  var wks=Math.round((Date.now()-new Date(state.history[n]+'T00:00:00').getTime())/(7*24*60*60*1000));
  return wks===0?'this week':wks===1?'1 wk ago':wks+'wks ago';
}

function score(m){
  var last=state.history[m.name]?new Date(state.history[m.name]+'T00:00:00').getTime():0;
  var wks=last?(Date.now()-last)/(7*24*60*60*1000):99;
  var cnt=state.pickCounts[m.name]||0;
  var rec=wks<1?0:wks<2?10:wks<4?40:wks<8?70:90;
  return rec*0.5+Math.min(cnt*15,60)*0.5+Math.random()*20;
}
function weightedPick(pool,n){
  var active=pool.filter(function(m){return !isArchived(m.name);});
  var scored=active.map(function(m){return{m:m,s:score(m)};}).sort(function(a,b){return b.s-a.s;});
  var top=scored.slice(0,Math.min(15,scored.length));
  var total=top.reduce(function(s,x){return s+x.s;},0);
  var picked=[];var used=new Set();var att=0;
  while(picked.length<n&&att<300){
    att++;var r=Math.random()*total;
    for(var i=0;i<top.length;i++){r-=top[i].s;if(r<=0&&!used.has(i)){used.add(i);picked.push(top[i].m);break;}}
  }
  if(picked.length<n){
    var rem=active.filter(function(m){return !picked.some(function(p){return p.name===m.name;});});
    while(picked.length<n&&rem.length)picked.push(rem.splice(Math.floor(Math.random()*rem.length),1)[0]);
  }
  return picked.slice(0,n);
}

function toggleGF(){
  state.gfMode=!state.gfMode;
  save();
  var sw=document.getElementById('gf-toggle-sw');
  sw.className='toggle-sw'+(state.gfMode?' on':'');
  showToast(state.gfMode?'GF mode on — randomizer uses GF meals only':'GF mode off');
}

var toastTimer=null;
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2200);}

function randomize(type){
  if(type==='dinner'){
    var pool=getDinnerPool();
    var n=state.dinners.length||6;
    state.dinners=weightedPick(pool,n);
    while(state.dinners.length<n)state.dinners.push(null);
  } else {
    var pool2=getLunchPool();
    var n2=state.lunches.length||6;
    state.lunches=weightedPick(pool2,n2);
    while(state.lunches.length<n2)state.lunches.push(null);
  }
  save();renderPlan(true);
}

function renderPlan(animate){
  var sw=document.getElementById('gf-toggle-sw');
  sw.className='toggle-sw'+(state.gfMode?' on':'');
  renderSlots('dinner-slots',state.dinners,'dinner',animate);
  renderSlots('lunch-slots',state.lunches,'lunch',animate);
  document.getElementById('dinner-count').textContent=state.dinners.filter(Boolean).length+' / '+state.dinners.length;
  document.getElementById('lunch-count').textContent=state.lunches.filter(Boolean).length+' / '+state.lunches.length;
  document.getElementById('add-dinner-btn').style.display=state.dinners.length>=6?'none':'';
  document.getElementById('add-lunch-btn').style.display=state.lunches.length>=6?'none':'';
}

function renderSlots(id,plan,type,animate){
  var el=document.getElementById(id);el.innerHTML='';
  plan.forEach(function(m,i){
    var div=document.createElement('div');
    var filled=m?(type==='lunch'?'lunch-filled':'dinner-filled'):'';
    div.className='slot'+(m?' '+filled:'');
    div.onclick=function(){openPicker(i,type);};
    if(m){
      var shopBadge=m.list==='needs'?'<span class="slot-badge badge-needs">needs shopping</span>':'<span class="slot-badge badge-ready">ready</span>';
      var favBadge=isFav(m.name)?'<span class="slot-badge badge-fav">fav</span>':'';
      var gfBadge=m.gf?'<span class="slot-badge badge-gf">GF</span>':'';
      var ago=agoLabel(m.name);var agoBadge=ago&&ago!=='this week'?'<span class="slot-badge badge-fresh">'+ago+'</span>':'';
      var noteHtml=m.notes?'<div class="slot-note">'+m.notes+'</div>':'';
      div.innerHTML='<div class="slot-label">'+(type==='lunch'?'Lunch':'Dinner')+' '+(i+1)+'</div>'
        +'<div class="slot-name">'+m.name+'</div>'
        +noteHtml
        +'<div class="slot-meta">'+shopBadge+gfBadge+favBadge+agoBadge+'</div>';
      var rm=document.createElement('button');rm.className='slot-rm';rm.textContent='×';
      rm.onclick=function(e){e.stopPropagation();removeSlot(i,type);};
      div.appendChild(rm);
    } else {
      div.innerHTML='<div class="slot-label">'+(type==='lunch'?'Lunch':'Dinner')+' '+(i+1)+'</div><div class="slot-empty">tap to pick</div>';
    }
    el.appendChild(div);
  });
}
function removeSlot(i,type){if(type==='dinner')state.dinners[i]=null;else state.lunches[i]=null;state.gc={};save();renderPlan();}
function addSlot(type){
  if(type==='dinner'&&state.dinners.length<6){state.dinners.push(null);save();renderPlan();}
  else if(type==='lunch'&&state.lunches.length<6){state.lunches.push(null);save();renderPlan();}
}
function clearPlan(){state.dinners=[null,null,null,null,null,null];state.lunches=[null,null,null,null,null,null];state.gc={};save();renderPlan();}

var activeFilter='all',searchTerm='',showArchived=false,addFormOpen=false;

function renderMeals(filter,search){
  var el=document.getElementById('meal-grid');el.innerHTML='';
  var all=getMeals();
  var active=all.filter(function(m){return !isArchived(m.name);});
  var archived=all.filter(function(m){return isArchived(m.name);});
  var list=active.filter(function(m){
    if(filter==='dinner')return m.cat==='dinner'||m.cat==='both';
    if(filter==='lunch')return m.cat==='lunch'||m.cat==='both';
    if(filter==='both')return m.cat==='both';
    if(filter==='needs')return m.list==='needs';
    if(filter==='favorites')return isFav(m.name);
    if(filter==='gf')return m.gf===true;
    return true;
  });
  if(search){
    list=list.filter(function(m){return m.name.toLowerCase().includes(search.toLowerCase());});
    archived=archived.filter(function(m){return m.name.toLowerCase().includes(search.toLowerCase());});
  }
  if(filter==='all'&&!search){
    var groups=[
      {label:'Dinner only',items:list.filter(function(m){return m.cat==='dinner';})},
      {label:'Both lunch & dinner',items:list.filter(function(m){return m.cat==='both';})},
      {label:'Lunch only',items:list.filter(function(m){return m.cat==='lunch';})},
    ];
    groups.forEach(function(g){
      if(!g.items.length)return;
      var lbl=document.createElement('div');lbl.className='group-lbl';lbl.textContent=g.label;
      el.appendChild(lbl);
      g.items.forEach(function(m){el.appendChild(makeMealItem(m));});
    });
  } else {
    if(!list.length&&!archived.length){el.innerHTML='<div class="empty">No meals match</div>';return;}
    list.forEach(function(m){el.appendChild(makeMealItem(m));});
  }
  if(archived.length){
    var div=document.createElement('div');div.className='archive-divider';
    div.innerHTML='<span>'+(showArchived?'▾':'▸')+' Archived ('+archived.length+')</span>';
    div.onclick=function(){showArchived=!showArchived;renderMeals(activeFilter,searchTerm);};
    el.appendChild(div);
    if(showArchived){
      archived.forEach(function(m){
        var item=document.createElement('div');item.className='meal-item archived';
        item.innerHTML='<div class="meal-info"><div class="meal-name">'+m.name+'</div></div>'
          +'<div class="meal-right"><div class="meal-actions"><button class="icon-btn restore" data-r="'+m.name+'" title="Restore">↩</button></div></div>';
        item.querySelector('[data-r]').addEventListener('click',function(e){e.stopPropagation();restoreMeal(this.getAttribute('data-r'));});
        el.appendChild(item);
      });
    }
  }
}

function makeMealItem(m){
  var inPlan=[].concat(state.dinners,state.lunches).some(function(p){return p&&p.name===m.name;});
  var div=document.createElement('div');div.className='meal-item'+(inPlan?' selected':'');
  var catTag=m.cat==='dinner'?'<span class="meal-tag tag-dinner">dinner</span>':m.cat==='lunch'?'<span class="meal-tag tag-lunch">lunch</span>':'<span class="meal-tag tag-both">lunch & dinner</span>';
  var needsTag=m.list==='needs'?'<span class="meal-tag tag-needs">needs shopping</span>':'';
  var favTag=isFav(m.name)?'<span class="meal-tag tag-fav">fav</span>':'';
  var newTag=m.isNew?'<span class="meal-tag tag-new">new</span>':'';
  var gfTag=m.gf?'<span class="meal-tag tag-gf">GF</span>':'';
  var cnt=state.pickCounts[m.name]||0;
  var cntHtml=cnt>0?'<div class="meal-cnt">picked '+cnt+'x</div>':'';
  var linkHtml='';
  if(m.url){var a=document.createElement('a');a.href=m.url;a.target='_blank';a.className='meal-link';a.textContent='recipe ↗';linkHtml=a.outerHTML;}
  var notesHtml=m.notes?'<div class="meal-sub">'+m.notes+'</div>':'';
  div.innerHTML='<div class="meal-info">'
    +'<div class="meal-name">'+m.name+'</div>'
    +notesHtml
    +'<div class="meal-tags">'+catTag+needsTag+gfTag+favTag+newTag+'</div>'
    +'</div>'
    +'<div class="meal-right">'+cntHtml+linkHtml
    +'<div class="meal-actions">'
    +'<button class="icon-btn" data-detail="'+m.name+'" title="Details">⋯</button>'
    +'<button class="icon-btn" data-archive="'+m.name+'" title="Archive">−</button>'
    +'</div></div>';
  div.querySelector('[data-archive]').addEventListener('click',function(e){e.stopPropagation();archiveMeal(this.getAttribute('data-archive'));});
  div.querySelector('[data-detail]').addEventListener('click',function(e){e.stopPropagation();openDetail(this.getAttribute('data-detail'));});
  div.onclick=function(){quickAdd(m);};
  return div;
}

function archiveMeal(n){if(!isArchived(n))state.archived.push(n);save();renderMeals(activeFilter,searchTerm);}
function restoreMeal(n){state.archived=state.archived.filter(function(x){return x!==n;});save();renderMeals(activeFilter,searchTerm);}
function quickAdd(m){
  if(m.cat==='both'){
    var de=state.dinners.findIndex(function(p){return !p;});
    var le=state.lunches.findIndex(function(p){return !p;});
    if(de>=0)state.dinners[de]=m;else if(le>=0)state.lunches[le]=m;else return;
  } else {
    var plan=m.cat==='lunch'?state.lunches:state.dinners;
    var e=plan.findIndex(function(p){return !p;});if(e<0)return;plan[e]=m;
  }
  recordPick(m.name);state.gc={};save();renderPlan();switchTab('plan');
}
function recordPick(n){state.history[n]=new Date().toISOString().split('T')[0];state.pickCounts[n]=(state.pickCounts[n]||0)+1;}

function setFilter(f,el){activeFilter=f;document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});el.classList.add('active');renderMeals(f,searchTerm);}
function filterMeals(val){searchTerm=val;renderMeals(activeFilter,val);}

var addFormOpen=false;
function toggleAddForm(){addFormOpen=!addFormOpen;document.getElementById('add-form-wrap').style.display=addFormOpen?'block':'none';}
function cancelAdd(){addFormOpen=false;document.getElementById('add-form-wrap').style.display='none';}
function saveNewMeal(){
  var name=document.getElementById('new-name').value.trim();
  if(!name){showToast('Enter a meal name');return;}
  var cat=document.getElementById('new-cat').value;
  var status=document.getElementById('new-status').value;
  var gf=document.getElementById('new-gf').value==='yes';
  var url=document.getElementById('new-url').value.trim();
  var notes=document.getElementById('new-notes').value.trim();
  var ings=document.getElementById('new-ingredients').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  state.custom.push({name:name,cat:cat,list:status,gf:gf,url:url,notes:notes,i:ings,isNew:true});
  save();cancelAdd();renderMeals(activeFilter,searchTerm);showToast('Added: '+name);
}

function renderGrocery(){
  var planned=[].concat(state.dinners,state.lunches).filter(Boolean);
  var el=document.getElementById('grocery-content');
  if(!planned.length){el.innerHTML='<div class="empty">Add meals to your week plan first</div>';document.getElementById('g-badge').textContent='';return;}
  var allItems=[];
  planned.forEach(function(meal){(meal.ingredients||[]).forEach(function(ing){allItems.push({meal:meal.name,ing:ing});});});
  if(!allItems.length){el.innerHTML='<div class="empty">All ingredients are pantry staples — you\'re good to go!</div>';document.getElementById('g-badge').textContent='';return;}
  var checked=allItems.filter(function(_,i){return !!state.gc[i];}).length;
  document.getElementById('g-badge').textContent=checked+' / '+allItems.length+' checked';
  var html='';var idx=0;
  planned.forEach(function(meal){
    var ings=meal.ingredients||[];if(!ings.length)return;
    var gfBadge=meal.gf?'<span class="meal-tag tag-gf">GF</span>':'';
    var link=meal.url?'<a href="'+meal.url+'" target="_blank" class="meal-link">recipe ↗</a>':'';
    html+='<div class="grocery-meal-group"><div class="grocery-meal-title">'+meal.name+' '+gfBadge+' '+link+'</div>';
    ings.forEach(function(ing){var i=idx++;var done=!!state.gc[i];html+='<div class="grocery-item"><div class="g-check'+(done?' done':'')+'" data-idx="'+i+'"></div><div class="g-text'+(done?' done':'')+'">'+ing+'</div></div>';});
    html+='</div>';
  });
  el.innerHTML=html;
  el.querySelectorAll('.g-check').forEach(function(c){c.addEventListener('click',function(){var i=parseInt(this.getAttribute('data-idx'));state.gc[i]=!state.gc[i];save();renderGrocery();});});
}

var pickerSlotIdx=0,pickerType='dinner';
function openPicker(idx,type){
  pickerSlotIdx=idx;pickerType=type;
  var cur=type==='lunch'?state.lunches[idx]:state.dinners[idx];
  document.getElementById('picker-title').textContent=cur?'Swap meal':'Pick a meal';
  document.getElementById('picker-search').value='';
  renderPickerList('');
  document.getElementById('picker-overlay').style.display='flex';
}
function renderPickerList(search){
  var el=document.getElementById('picker-list');el.innerHTML='';
  var all=getMeals();
  var pool=(pickerType==='lunch'?all.filter(function(m){return m.cat==='lunch'||m.cat==='both';}):all.filter(function(m){return m.cat==='dinner'||m.cat==='both';})).filter(function(m){return !isArchived(m.name);});
  var list=search?pool.filter(function(m){return m.name.toLowerCase().includes(search.toLowerCase());}):pool;
  list.forEach(function(m){
    var div=document.createElement('div');div.className='meal-item';
    var needsTag=m.list==='needs'?'<span class="meal-tag tag-needs">needs shopping</span>':'';
    var gfTag=m.gf?'<span class="meal-tag tag-gf">GF</span>':'';
    var favTag=isFav(m.name)?'<span class="meal-tag tag-fav">fav</span>':'';
    div.innerHTML='<div class="meal-info"><div class="meal-name">'+m.name+'</div><div class="meal-tags">'+needsTag+gfTag+favTag+'</div></div>';
    div.onclick=function(){pickMeal(m);};el.appendChild(div);
  });
}
function pickMeal(m){
  if(pickerType==='lunch')state.lunches[pickerSlotIdx]=m;else state.dinners[pickerSlotIdx]=m;
  recordPick(m.name);state.gc={};save();renderPlan();closePicker();
}
function closePicker(e){if(!e||e.target===document.getElementById('picker-overlay'))document.getElementById('picker-overlay').style.display='none';}

function openDetail(name){
  var all=getMeals();var m=all.find(function(x){return x.name===name;});if(!m)return;
  renderDetailView(m);
  document.getElementById('detail-overlay').style.display='flex';
}

function renderDetailView(m){
  var sheet=document.getElementById('detail-sheet');
  var ings=m.i||m.ingredients||[];
  var rawIngs=m.i||[];
  var linkHtml=m.url?'<a href="'+m.url+'" target="_blank" class="meal-link" style="font-size:13px">View recipe ↗</a>':'';
  var gfTag=m.gf?'<span class="meal-tag tag-gf">GF</span> ':'';
  var filteredIngs=(m.ingredients||rawIngs.filter(function(x){return !isStaple(x);}));
  sheet.innerHTML=
    '<div class="picker-header"><span>'+m.name+'</span><button class="picker-close" onclick="closeDetail()">×</button></div>'
    +(gfTag?'<div style="margin-bottom:8px">'+gfTag+'</div>':'')
    +(m.notes?'<div style="font-size:13px;color:var(--ink3);margin-bottom:10px">'+m.notes+'</div>':'')
    +(linkHtml?'<div style="margin-bottom:10px">'+linkHtml+'</div>':'')
    +(filteredIngs.length?'<div class="card-title" style="margin-bottom:6px">Ingredients to buy</div><ul style="font-size:13px;color:var(--ink2);line-height:1.8;padding-left:18px">'+filteredIngs.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>':'<div style="font-size:13px;color:var(--ink4);margin-bottom:10px">All pantry staples — nothing to buy</div>')
    +'<div style="margin-top:14px"><button class="btn btn-green" onclick="renderDetailEdit(\''+m.name.replace(/'/g,"\\'")+'\')" style="width:100%">Edit this meal</button></div>';
}

function renderDetailEdit(name){
  var all=getMeals();var m=all.find(function(x){return x.name===name;});if(!m)return;
  var sheet=document.getElementById('detail-sheet');
  var rawIngs=(m.i||[]).join('\n');
  sheet.innerHTML=
    '<div class="picker-header"><span>Edit meal</span><button class="picker-close" onclick="closeDetail()">×</button></div>'
    +'<label class="form-label">Meal name</label>'
    +'<input type="text" class="form-input" id="e-name" value="'+m.name.replace(/"/g,'&quot;')+'" />'
    +'<label class="form-label">Status</label>'
    +'<select class="form-input" id="e-status">'
    +'<option value="normal"'+(m.list==='normal'?' selected':'')+'>Ready to cook</option>'
    +'<option value="needs"'+(m.list==='needs'?' selected':'')+'>Needs shopping</option>'
    +'</select>'
    +'<label class="form-label">Gluten-free?</label>'
    +'<select class="form-input" id="e-gf">'
    +'<option value="yes"'+(m.gf?' selected':'')+'>Yes</option>'
    +'<option value="no"'+(!m.gf?' selected':'')+'>No</option>'
    +'</select>'
    +'<label class="form-label">Recipe URL</label>'
    +'<input type="text" class="form-input" id="e-url" value="'+(m.url||'').replace(/"/g,'&quot;')+'" />'
    +'<label class="form-label">Notes</label>'
    +'<textarea class="form-input" id="e-notes" style="min-height:50px">'+(m.notes||'')+'</textarea>'
    +'<label class="form-label">Ingredients to buy (one per line)</label>'
    +'<textarea class="form-input" id="e-ingredients" style="min-height:80px">'+rawIngs+'</textarea>'
    +'<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="btn btn-green" onclick="saveDetailEdit(\''+name.replace(/'/g,"\\'")+'\',\''+m.name.replace(/'/g,"\\'")+'\');return false;" style="flex:1">Save</button>'
    +'<button class="btn" onclick="renderDetailView(getMeals().find(function(x){return x.name===\''+m.name.replace(/'/g,"\\'")+'\'}))">Cancel</button>'
    +'</div>';
}

function saveDetailEdit(origName, displayName){
  var newName=document.getElementById('e-name').value.trim();
  if(!newName){showToast('Name cannot be empty');return;}
  var status=document.getElementById('e-status').value;
  var gf=document.getElementById('e-gf').value==='yes';
  var url=document.getElementById('e-url').value.trim();
  var notes=document.getElementById('e-notes').value.trim();
  var ings=document.getElementById('e-ingredients').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var override={name:newName,cat:getMeals().find(function(x){return x.name===origName;})?getMeals().find(function(x){return x.name===origName;}).cat:'both',list:status,gf:gf,url:url,notes:notes,i:ings,isCustom:true};
  var existingIdx=state.custom.findIndex(function(x){return x.name===origName;});
  if(existingIdx>=0){state.custom[existingIdx]=override;}
  else{state.custom.push(override);}
  if(origName!==newName){state.archived=state.archived.filter(function(x){return x!==origName;});}
  state.gc={};save();
  closeDetail();
  renderMeals(activeFilter,searchTerm);
  showToast('Saved: '+newName);
}

function closeDetail(e){if(!e||e.target===document.getElementById('detail-overlay'))document.getElementById('detail-overlay').style.display='none';}

function copyGroceryList(){
  var planned=[].concat(state.dinners,state.lunches).filter(Boolean);
  if(!planned.length){showToast('No meals planned yet');return;}
  var text='';
  planned.forEach(function(meal){
    var ings=meal.ingredients||[];
    if(!ings.length)return;
    text+=meal.name+':\n';
    ings.forEach(function(ing){text+='  • '+ing+'\n';});
    text+='\n';
  });
  if(!text){showToast('Nothing to copy — all pantry staples');return;}
  navigator.clipboard.writeText(text.trim()).then(function(){
    showToast('Grocery list copied!');
    var btn=document.getElementById('copy-btn');
    btn.textContent='Copied ✓';
    setTimeout(function(){btn.textContent='Copy list';},2000);
  }).catch(function(){
    showToast('Copy failed — try selecting manually');
  });
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',['plan','meals','grocery'][i]===tab);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='meals')renderMeals(activeFilter,searchTerm);
  if(tab==='grocery')renderGrocery();
}

renderPlan();
</script>
</body>
</html>
